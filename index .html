@keyframes spDraw{to{stroke-dashoffset:0}}

/* ---------- CSV import ---------- */
function parseCSV(t){
  t=String(t).replace(/^\uFEFF/,'');
  const first=t.split(/\r?\n/)[0]||'',dl=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==dl){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(x=>x.some(v=>String(v).trim()!==''));
}
function csvDate(v){
  v=String(v||'').trim();if(!v)return '';
  let m1=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m1)return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  m1=v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m1)return `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
  return '';
}
function importCSV(file,inp){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCSV(rd.result);
      if(rows.length<2)return toast('No data found in the CSV.');
      const hd=rows[0].map(h=>String(h).trim().toLowerCase().replace(/[^a-z]/g,''));
      const al={name:['name','itemname','item','medicine'],barcode:['barcode','code'],unit:['unit'],rack:['rack','shelf'],batch:['batch','batchno'],
        expiry:['expiry','expirydate','exp'],cost:['cost','costprice','purchaseprice'],price:['price','saleprice','sellingprice','rate'],
        stock:['stock','qty','quantity','currentstock'],reorder:['reorder','reorderlevel'],salt:['salt','formula','generic'],company:['company','manufacturer','brand'],category:['category','type'],upp:['upp','unitsperpack','unitspack','perpack','packsize'],tax:['tax','taxrate','taxpercent']};
      const ix={};for(const k in al){ix[k]=hd.findIndex(h=>al[k].includes(h))}
      if(ix.name<0)return toast('No "name" column found. Download the sample CSV to see the format.');
      const g=(r,k)=>ix[k]>=0?String(r[ix[k]]??'').trim():'';
      const list=[];let skipped=0;
      rows.slice(1).forEach(r=>{
        const name=g(r,'name');if(!name){skipped++;return}
        list.push({name,barcode:g(r,'barcode'),unit:g(r,'unit'),rack:g(r,'rack'),batch:g(r,'batch'),expiry:csvDate(g(r,'expiry')),
          cost:n(g(r,'cost').replace(/,/g,'')),price:n(g(r,'price').replace(/,/g,'')),stock:n(g(r,'stock').replace(/,/g,'')),reorder:n(g(r,'reorder').replace(/,/g,'')),
          salt:g(r,'salt'),company:g(r,'company'),category:g(r,'category'),upp:Math.max(1,Math.round(n(g(r,'upp').replace(/,/g,''))||1)),taxRate:n(g(r,'tax').replace(/,/g,'')),has:{cost:ix.cost>=0,price:ix.price>=0,stock:ix.stock>=0,reorder:ix.reorder>=0,upp:ix.upp>=0,taxRate:ix.tax>=0}});
      });
      const nk=x=>String(x).toLowerCase().replace(/\s+/g,' ').trim();
      const find=o=>D.items.find(i=>(o.barcode&&i.barcode&&String(i.barcode)==o.barcode)||nk(i.name)==nk(o.name));
      const seen=new Map();list.forEach(o=>{o.name=o.name.replace(/\s+/g,' ');seen.set(o.barcode||nk(o.name),o)});
      const dup=list.length-seen.size;list.length=0;seen.forEach(o=>list.push(o));
      const nw=list.filter(o=>!find(o)).length,up=list.length-nw;
      if(!list.length)return toast('No valid rows found.');
      const sci=list.filter(o=>/^\d(\.\d+)?e\+?\d+$/i.test(o.barcode)).length;
      if(!confirm(`${nw} new items will be added, ${up} existing items will be updated (price, stock and details come from the CSV).`+(dup?`\n${dup} duplicate rows in the file were merged into one.`:'')+(skipped?`\n${skipped} empty rows skipped.`:'')+(sci?'\nWARNING: '+sci+' barcodes are in scientific format (8.9E+12). Set the barcode column to Text in Excel and export the CSV again.':'')+'\nContinue?'))return;
      list.forEach(o=>{
        const ex=find(o),d={name:o.name,barcode:o.barcode,unit:o.unit,rack:o.rack,batch:o.batch,expiry:o.expiry,cost:o.cost,price:o.price,stock:o.stock,reorder:o.reorder,salt:o.salt,company:o.company,category:o.category,upp:o.upp,taxRate:o.taxRate};
        if(ex){for(const k in d){if(['cost','price','stock','reorder','upp','taxRate'].includes(k)){if(o.has[k])ex[k]=d[k]}else if(d[k]!=='')ex[k]=d[k]}if(o.has.stock)ex.batches=ex.stock>0?[{batch:ex.batch||'',expiry:ex.expiry||'',qty:ex.stock}]:[]}
        else D.items.push({id:nid(),...d,batches:d.stock>0?[{batch:d.batch,expiry:d.expiry,qty:d.stock}]:[]});
      });
      save();render();toast(`Import complete: ${nw} new, ${up} updated.`);
    }catch(e){showErr(e);toast('CSV import failed.')}
    finally{if(inp)inp.value=''}
  };
  rd.readAsText(file);
}

  else if(pm==='Split Payment')pay=`<div class="row"><div><label>Cash</label><input type="number" step="any" value="${esc(spC)}" oninput="spC=this.value;calcTot()"></div><div><label>Card</label><input type="number" step="any" value="${esc(spCd)}" oninput="spCd=this.value;calcTot()"></div><div><label>Wallet</label><input type="number" step="any" value="${esc(spW)}" oninput="spW=this.value;calcTot()"></div></div><div class="empty">Whatever is left after these amounts goes on the customer's account (credit).</div>`;
  return `<table><tr><th>Item</th><th>Unit</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Total</th><th></th></tr>${rows}</table>
  <div class="row"><div><label>Discount (Rs)</label><input type="number" step="any" value="${bd||''}" oninput="bd=n(this.value);calcTot()"></div><div><label>Tax % (empty = use each item's tax)</label><input type="number" step="any" value="${bt||''}" oninput="bt=n(this.value);calcTot()"></div></div>
  <div id="s_tot">${totHtml()}</div>${pay}
  <button class="p" onclick="saveBill('sale')">Save &amp; Print Invoice</button> <button class="s" onclick="holdBill()">Hold Bill</button> <button class="s" onclick="saveAccount()">Account Save</button>`;
}
function totHtml(){
  const sub=S(cart,l=>l.qty*l.rate),disc=Math.max(0,Math.min(n(bd),sub)),tax=calcTax(cart,sub,disc,Math.max(0,n(bt))),tot=n(sub-disc+tax);
  let h=`<div class="tot"><span>Subtotal</span><span>${m(sub)}</span></div>`;
  if(disc>0)h+=`<div class="tot"><span>Discount</span><span>- ${m(disc)}</span></div>`;
  if(tax>0)h+=`<div class="tot"><span>Tax</span><span>${m(tax)}</span></div>`;
  h+=`<div class="tot"><span>Total</span><span>${m(tot)}</span></div>`;
  if(pm==='Cash'&&n(rcv)>0){const ch=n(n(rcv)-tot);h+=`<div class="tot"><span>${ch>=0?'Change to return':'Still to receive'}</span><span class="${ch>=0?'pos':'neg'}">${m(Math.abs(ch))}</span></div>`}
  if(pm==='Split Payment'){const rest=n(tot-n(spC)-n(spCd)-n(spW));h+=`<div class="tot"><span>${rest<0?'Over-paid by':'On account (credit)'}</span><span class="${rest<0?'neg':''}">${m(Math.abs(rest))}</span></div>`}
  return h;
}

function setLine(k,f,v,el){
  const l=cart[k];if(!l)return;

  if(f==='unit'){l.u=v==='l'?'l':'p';l.cnt=1;l.qty=nq(1/(l.u==='l'?U:1));render();return}
  v=Math.max(0,+v||0);
  if(f==='cnt'){
    const d=l.u==='l'?U:1;let q=nq(v/d);
    if(i&&q>i.stock+0.0005){q=i.stock;v=nq(q*d);if(el)el.value=v;toast('Only '+sf(i)+' in stock.')}
    l.cnt=v;l.qty=q;
  }else if(f==='price'){l.rate=n(v*(l.u==='l'?U:1))}
  const t=$('#lt_'+k);if(t)t.textContent=m(l.qty*l.rate);calcTot();
}

function saveBill(type){
  const sale=type==='sale';
  if(sale)cart=cart.filter(l=>l.qty>0);
  if(!cart.length)return false;
  if(sale){
    const bad=cart.find(l=>{const i=D.items.find(x=>x.id==l.itemId);return !i||l.qty>i.stock+0.0005});
    if(bad){toast('Not enough stock: '+bad.name);return false}
    if(cart.some(l=>l.rate<l.cost)&&!confirm('Some items are priced below cost. Save anyway?'))return false;
  }
  const pmv=val('b_pay_method'),isSplit=sale&&pmv==='Split Payment';
  const sub=S(cart,l=>l.qty*l.rate),disc=Math.max(0,Math.min(n(bd),sub)),tax=calcTax(cart,sub,disc,Math.max(0,n(bt))),tot=n(sub-disc+tax);
  let pays=null,credAmt=pmv.startsWith('Credit')?tot:0;
  if(isSplit){
    const c=n(spC),cd=n(spCd),w=n(spW),rest=n(tot-c-cd-w);
    if(c<0||cd<0||w<0){toast('Amounts cannot be negative.');return false}
    if(rest<0){toast('Split amounts are more than the bill total.');return false}
    pays=[];
    if(c)pays.push({m:'Cash',a:c});
    if(cd)pays.push({m:'Card',a:cd});
    if(w)pays.push({m:'Online Wallet / Easypaisa',a:w});
    if(rest)pays.push({m:'Credit (On Account)',a:rest});
    credAmt=rest;
  }
  const phone=sale?String((($('#b_cphone')||{}).value)||'').trim():'';
  let partyId;
  if(sale){
    const nm=val('b_cname').trim();
    if(!nm&&credAmt>0){toast('Enter the customer name for a credit sale.');return false}
    if(nm){
      let pt=D.parties.find(x=>x.type==='customer'&&x.name.toLowerCase()===nm.toLowerCase());
      if(pt&&credAmt>0&&n(pt.limit)>0&&n(balance(pt)+credAmt)>n(pt.limit)&&!confirm('Credit limit exceeded for '+pt.name+'.\nLimit: '+m(pt.limit)+'\nOutstanding: '+m(balance(pt))+' + this bill on credit: '+m(credAmt)+'\nSave anyway?'))return false;
      if(!pt){pt={id:nid(),name:nm,type:'customer',phone:''};D.parties.push(pt)}
      if(phone&&!pt.phone)pt.phone=phone;
      partyId=pt.id;
    }else partyId=1;
  }else{
    const vn=val('b_vname').trim();
    if(!vn&&pmv.startsWith('Credit')){toast('Enter the vendor name for a credit purchase.');return false}
    if(vn){let pt=D.parties.find(x=>x.type==='vendor'&&x.name.toLowerCase()===vn.toLowerCase());
      if(!pt){pt={id:nid(),name:vn,type:'vendor',phone:''};D.parties.push(pt)}partyId=pt.id}
    else partyId=2;
  }
  cart.forEach(l=>{
    let i=D.items.find(x=>x.id==l.itemId);
    if(!i&&!sale)i=D.items.find(x=>x.name.toLowerCase()===l.name.toLowerCase());
    if(!i&&!sale){i={id:nid(),name:l.name,barcode:l.barcode||'',unit:'',rack:'',batch:'',expiry:'',cost:l.rate,price:l.salePrice||0,stock:0,reorder:0,salt:l.salt||'',company:'',category:'',upp:Math.max(1,Math.round(+l.upp||1)),taxRate:0,batches:[]};D.items.push(i)}
    if(i){l.itemId=i.id;
      if(sale){l.batch=takeStock(i,l.qty)||l.batch;l.bts=TK.slice()}
      else{const os=Math.max(0,i.stock);i.cost=n((os*i.cost+l.qty*l.rate)/(os+l.qty));addBatch(i,l.qty,l.batchNo,l.expiry);l.batch=l.batchNo||'';if(l.salePrice>0)i.price=l.salePrice;if(l.barcode&&!i.barcode)i.barcode=l.barcode}}
  });
  last={id:nid(),type,no:D.seq[type]++,date:today(),time:nowT(),partyId,payMethod:pmv,lines:cart,sub,disc,tax,total:tot,user:currentUser};
  if(pays)last.pays=pays;
  if(sale){
    if(phone)last.phone=phone;
    const rc=n(rcv);if(pmv==='Cash'&&rc>tot){last.rcv=rc;last.change=n(rc-tot)}
  }
  D.bills.push(last);
  if(sale)rememberRates(partyId,cart);
  if(sale&&!isSplit&&pmv.startsWith('Credit')&&partyId>2){
    const pd=Math.min(n((($('#s_paid')||{}).value)),tot);
    if(pd>0)D.pay.push({id:nid(),partyId,amt:pd,date:today(),time:nowT(),m:'Cash',note:'Part payment bill #'+last.no});
  }
  cart=[];bd=0;bt=0;
  if(sale){cph='';rcv='';spC='';spCd='';spW=''}
  save();render();return true;
}

function ebSave(){
  const b=D.bills.find(x=>x.id==eb.id);if(!b||!canEdit(b))return;
  const sale=b.type==='sale',lines=eb.lines.filter(l=>l.qty>0),nm=eb.party.trim(),pay=eb.pay;
  if(!lines.length)return toast('At least one item with quantity is required. Use Cancel Bill to remove the bill.');
  if(!nm&&pay.startsWith('Credit'))return toast('Enter the '+(sale?'customer':'vendor')+' name for a credit bill.');
  if(sale&&lines.some(l=>l.rate<l.cost)&&!confirm('Some items are priced below cost. Save anyway?'))return;
  if(!sale&&b.lines.some(l=>{const i=D.items.find(x=>x.id==l.itemId);return !i||i.stock<l.qty-0.0005}))return toast('Not enough stock on hand; this purchase cannot be edited.');
  const snap=JSON.stringify(D),fail=msg=>{D=JSON.parse(snap);toast(msg);return false};
  /* 1. undo the old bill's effect on stock and part-payments */
  b.lines.forEach(l=>{const i=D.items.find(x=>x.id==l.itemId);if(!i)return;if(sale)restoreStock(i,l,l.qty);else takeStock(i,l.qty)});
  D.pay=D.pay.filter(x=>!(x.partyId==b.partyId&&String(x.note||'')==='Part payment bill #'+b.no));
  /* 2. check stock for the new quantities */
  if(sale){const need={};lines.forEach(l=>need[l.itemId]=nq((need[l.itemId]||0)+l.qty));
    for(const id in need){const i=D.items.find(x=>x.id==id);if(!i||need[id]>i.stock+0.0005)return fail('Not enough stock: '+(i?i.name:'item')+(i?' (available: '+sf(i)+')':''))}}
  /* 3. party */
  let partyId=sale?1:2;
  if(nm){const ty=sale?'customer':'vendor';let pt=D.parties.find(x=>x.type===ty&&x.name.toLowerCase()===nm.toLowerCase());
    if(!pt){pt={id:nid(),name:nm,type:ty,phone:''};D.parties.push(pt)}partyId=pt.id}
  /* 4. apply the new lines */
  lines.forEach(l=>{const i=D.items.find(x=>x.id==l.itemId);if(!i)return;
    if(sale){l.batch=takeStock(i,l.qty)||l.batch;l.bts=TK.slice()}
    else{const os=Math.max(0,i.stock);i.cost=n((os*i.cost+l.qty*l.rate)/(os+l.qty));addBatch(i,l.qty,l.batchNo,l.expiry);l.batch=l.batchNo||'';if(l.salePrice>0)i.price=l.salePrice}});
  const t=ebTot();
  Object.assign(b,{lines,partyId,payMethod:pay,sub:t.sub,disc:t.disc,tax:t.tax,total:t.total,edited:today()});
  delete b.rcv;delete b.change;
  if(sale)rememberRates(partyId,lines);
  if(String(pay).startsWith('Credit')&&partyId>2){const pd=Math.min(n(eb.paid),t.total);if(pd>0)D.pay.push({id:nid(),partyId,amt:pd,date:today(),time:nowT(),m:'Cash',note:'Part payment bill #'+b.no})}
  save();eb=null;toast('Bill updated.');render();
}

function processReturn(){
  const type=val('ret_type'),bNo=val('ret_bill_id').trim(),nm=val('ret_item'),qty=nq(retQty());
  const b=D.bills.find(x=>x.type===type&&String(x.no)===bNo),item=byNameOrBarcode(nm);
  if(!b)return toast('No '+(type==='sale'?'sale':'purchase')+' bill found with this number.');
  if(!item||qty<=0)return toast('Enter a valid item and quantity.');
  const ln=b.lines.find(l=>l.itemId==item.id);
  if(!ln)return toast('This item is not in that bill.');
  const done=nq(S(D.returns.filter(r=>r.type===type&&String(r.billNo)===bNo&&r.item===item.name),r=>r.qty));
  if(qty>nq(ln.qty-done)+0.0004)return toast('Cannot return more than sold (remaining: '+fq(nq(ln.qty-done),item)+').');
  if(type==='purchase'&&qty>item.stock+0.0004)return toast('Cannot return more than stock on hand.');
  const amt=val('ret_amt')===''?n(qty*ln.rate):n(val('ret_amt'));
  if(type==='sale')restoreStock(item,qty,ln,done);else takeStock(item,qty);
  D.returns.push({id:nid(),type,billNo:b.no,item:item.name,qty,refund:amt,cost:ln.cost||0,date:today()});
  const cr=creditOf(b);
  if(cr>0&&b.partyId>2&&b.total>0){const a=n(amt*Math.min(1,cr/b.total));if(a>0)D.pay.push({id:nid(),partyId:b.partyId,amt:a,date:today(),time:nowT(),m:'Adjust',note:'Return bill #'+b.no})}
  save();toast('Return processed and stock updated.');render();
}

th search.</p><p class="fy">Benefit: All medicine details are in one place, so medicines are easy to find and stock is never forgotten.</p></details><details ><summary>Bills</summary><p>History of all sale and purchase invoices. Click View to reopen or reprint any bill.</p><p class="fy">Benefit: If a customer asks for an old bill or there is a dispute, you have proof immediately.</p></details><details ><summary>Returns</summary><p>Record medicines returned by customers (sale return) or sent back to suppliers (purchase return). Stock is corrected automatically.</p><p class="fy">Benefit: Returns are tracked, stock stays correct, and refunds are included in the profit calculation.</p></details><details ><summary>Parties</summary><p>List of customers and suppliers. Choose &#x27;Credit (On Account)&#x27; on a bill to record money owed, then use Receive or Pay to settle.</p><p class="fy">Benefit: You always know who owes you and whom you owe, without a paper register.</p></details><details ><summary>Expenses</summary><p>Record daily costs such as rent, salary, electricity, transport and tea, and write the name of the person you paid. The Profit page then shows who received how much and what remains after expenses.</p><p class="fy">Benefit: True net profit is only known after expenses are deducted; this page does that.</p></details><details ><summary>Profit</summary><p>Pick a date range to see total sales, cost of goods, returns, gross profit and net profit. Below, see the profit of each item, its margin and its share of total profit.</p><p class="fy">Benefit: You see which medicines earn the most and which earn little, so you can stock wisely.</p></details><details ><summary>Settings</summary><p>Set the pharmacy name, address and phone (printed on bills), change your password, and download or restore a backup.</p><p class="fy">Benefit: Bills carry your shop details, your data is protected by a password, and backups prevent data loss.</p></details><details ><summary>Login <script type="text/plain" class="appjs">
/* ===== v3 additions ===== */
function once(f,rel){let l=0;return function(){if(l)return;l=1;setTimeout(()=>l=0,800);const r=f.apply(this,arguments);if(rel&&r===false)l=0;return r}}
let stp=0,_t;
/* auto-backup (IndexedDB) */
function idbOpen(cb){const r=indexedDB.open('pos_auto',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>cb(r.result)}
function idbPut(s){try{idbOpen(d=>{try{d.transaction('k','readwrite').objectStore('k').put(s,'last')}catch(e){}})}catch(e){}}
function idbGet(cb){try{idbOpen(d=>{const g=d.transaction('k').objectStore('k').get('last');g.onsuccess=()=>cb(g.result)})}catch(e){}}
const _save=save;save=function(){_save();clearTimeout(_t);_t=setTimeout(()=>idbPut(JSON.stringify(D)),1500)};
function autoRestore(){idbGet(s=>{if(!s)return toast('No auto-backup found.');if(!confirm('Restore data from the auto-backup? Current data will be replaced.'))return;D=JSON.parse(s);fix();save();toast('Restore complete.');render()})}
backup=function(){D.lastBackup=today();_save();const t=JSON.stringify(D),nm='pharmacy-backup-'+today()+'.json';let f=null;try{f=new File([t],nm,{type:'application/json'})}catch(e){}
 if(f&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Pharmacy Backup'}).catch(()=>{});
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=nm;a.click()}};
const _data=data;data=function(){return _data()+`<div class="card"><b>Auto-Backup</b><div class="empty">A copy of your data is saved on this device automatically after every change. Before changing phones, always use "Download Backup" (it can be shared via WhatsApp).</div><button class="s" onclick="autoRestore()">Restore from Auto-Backup</button></div>`};
if(!D.users.length)idbGet(s=>{if(s&&confirm('An earlier auto-backup was found. Restore the data?')){D=JSON.parse(s);fix();save();toggleAuth('login');amsg('Data restored. Please log in.',true)}});
/* duplicate protection */
const _si=saveItem;saveItem=once(function(){const nm=val('f_name').trim().toLowerCase();if(nm&&D.items.some(i=>i.name.toLowerCase()===nm&&i.id!=cur))return toast('This item already exists.');return _si()});
const _ap=addParty;addParty=once(function(){const nm=val('p_name').trim().toLowerCase(),ty=val('p_type');if(nm&&D.parties.some(p=>p.type===ty&&p.name.toLowerCase()===nm))return toast('This name already exists.');return _ap()});
['addExp','processReturn','addUser'].forEach(k=>{window[k]=once(window[k])});
/* multi-item purchase */
const PM=['Cash','Card','Online Wallet / Easypaisa','Credit (On Account)'];
const _bill=bill;bill=function(t){return t==='purchase'?purchaseBill():_bill(t)};
function purchaseBill(){
 if(last&&last.type==='purchase')return inv(last)+printBtns(last)+`<button class="s noprint" onclick="last=null;render()">New Purchase</button>`;
 const sub=S(cart,l=>l.qty*l.rate);
 return `<h2>Purchase Invoice</h2><div class="card"><div class="row"><div><label>Vendor (supplier)</label><input id="b_vname" value="${esc(cn)}" oninput="cn=this.value" list="vl" autocomplete="off"><datalist id="vl">${D.parties.filter(p=>p.type=='vendor'&&p.id!=2).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div><div><label>Payment</label><select id="b_pay_method" onchange="pm=this.value;render()">${PM.map(o=>`<option ${o==pm?'selected':''}>${o}</option>`).join('')}</select></div></div>
 <label>Item name / Barcode</label><input id="b_item" list="il" oninput="pickItem()" autocomplete="off"><datalist id="il">${D.items.map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist><div id="b_info" class="empty"></div>
 <div class="row"><div><label>Qty</label><input id="b_qty" type="number" step="any" value="1"></div><div><label>Cost price</label><input id="b_rate" type="number" step="any"></div></div>
 <div class="row"><div><label>Sale price</label><input id="b_sprice" type="number" step="any"></div><div><label>Barcode (new item)</label><input id="b_bc"></div></div>
 <div class="row"><div><label>Units per pack (new item)</label><input id="b_upp" type="number" step="any" value="1"></div><div><label>Salt / Formula (new item)</label><input id="b_salt"></div></div>
 <div class="row"><div><label>Batch</label><input id="b_batch"></div><div><label>Expiry</label><input id="b_exp" type="date"></div></div>
 <button class="s" onclick="addPLine()">+ Add to list</button></div>
 <div class="card scroll"><b>Items in this purchase (${cart.length})</b><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Cost</th><th class="r">Amount</th><th></th></tr>${cart.map((l,k)=>`<tr><td>${esc(l.name)}<br><small>${esc(l.batchNo||'')} ${l.expiry||''}</small></td><td class="r">${l.qty}</td><td class="r">${m(l.rate)}</td><td class="r">${m(l.qty*l.rate)}</td><td><button class="d" onclick="cart.splice(${k},1);render()">X</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No items yet.</td></tr>'}</table>
 <div class="row"><div><label>Discount (Rs)</label><input type="number" step="any" value="${bd||''}" oninput="bd=n(this.value)"></div><div><label>Tax %</label><input type="number" step="any" value="${bt||''}" oninput="bt=n(this.value)"></div></div>
 ${pm.startsWith('Credit')?`<label>Amount paid now (optional)</label><input id="s_paid" type="number" step="any">`:''}
 <p><b>Sub total: ${m(sub)}</b></p><button class="p" onclick="saveBill('purchase')">Save Purchase</button></div>
 <h2 style="font-size:17px;margin-top:18px">Saved Purchases</h2>${billBox('pur','Search...')}`}
function addPLine(){const typed=val('b_item').trim(),i=byNameOrBarcode(typed),qty=n(val('b_qty')),rate=n(val('b_rate'));
 if(!typed||qty<=0||rate<=0)return toast('Item, quantity and cost are required.');
 const bn=val('b_batch').trim(),ex=val('b_exp'),nm=i?i.name:typed,bc=val('b_bc').trim();
 if(!i&&bc&&D.items.some(x=>x.barcode==bc))return toast('This barcode belongs to another item.');
 const d=cart.find(l=>l.name.toLowerCase()===nm.toLowerCase()&&(l.batchNo||'')===bn&&(l.expiry||'')===ex);
 if(d){d.qty=n(d.qty+qty);d.rate=rate;toast('Same item found - quantities added together.')}
 else cart.push({itemId:i?i.id:null,name:nm,qty,rate,salePrice:n(val('b_sprice'))||(i?i.price:0),cost:rate,barcode:i?'':bc,upp:i?0:Math.max(1,Math.round(n(val('b_upp'))||1)),salt:i?'':val('b_salt').trim(),batch:'',batchNo:bn,expiry:ex});
 render();setTimeout(()=>{const e=$('#b_item');e&&e.focus()},0)}
const _sb=saveBill;saveBill=once(function(t){
 const pd=n((($('#s_paid')||{}).value)),pmv=($('#b_pay_method')||{}).value||'';const r=_sb(t);
 if(r&&t==='purchase'){cn='';if(pmv.startsWith('Credit')&&last.partyId>2){const p=Math.min(pd,last.total);if(p>0){D.pay.push({id:nid(),partyId:last.partyId,amt:p,date:today(),note:'Part payment bill #'+last.no});save()}}}
 return r},true);
/* ledger statement */
function showStmt(v){stp=+v;render()}
function stmtHtml(p){const e=[];D.bills.filter(b=>b.partyId==p.id&&String(b.payMethod||'').startsWith('Credit')).forEach(b=>e.push({d:b.date,id:b.id,t:'Bill #'+b.no,dr:b.total,cr:0}));
 D.pay.filter(x=>x.partyId==p.id).forEach(x=>e.push({d:x.date,id:x.id,t:x.note||'Payment',dr:0,cr:x.amt}));
 e.sort((a,b)=>a.d>b.d?1:a.d<b.d?-1:a.id-b.id);let r=0;
 return `<div id="stmtWrap" class="card"><b>${esc(D.shop.name)} - Statement: ${esc(p.name)}</b> <small>(${today()})</small><div class="scroll"><table><tr><th>Date</th><th>Detail</th><th class="r">Credit</th><th class="r">Paid</th><th class="r">Balance</th></tr>${e.map(x=>{r=n(r+x.dr-x.cr);return `<tr><td>${x.d}</td><td>${esc(x.t)}</td><td class="r">${x.dr?m(x.dr):''}</td><td class="r">${x.cr?m(x.cr):''}</td><td class="r">${m(r)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No entries.</td></tr>'}</table></div><button class="p noprint" onclick="document.body.classList.add('ps');window.print();setTimeout(()=>document.body.classList.remove('ps'),800)">Print Statement</button></div>`}
const _pa=parties;parties=function(){const o=D.parties.filter(p=>p.id>2).map(p=>`<option value="${p.id}" ${p.id==stp?'selected':''}>${esc(p.name)} (${p.type})</option>`).join('');
 const p=D.parties.find(x=>x.id==stp);return _pa()+`<div class="card noprint"><b>Statement / Ledger</b><select onchange="showStmt(this.value)"><option value="0">-- select a party --</option>${o}</select></div>`+(p?stmtHtml(p):'')};
</script>
<script type="text/plain" class="appjs">
/* ===== v8 additions: pack/loose, split payment, closing, orders, reports, audit, labels, security ===== */
const PMS=['Cash','Card','Online Wallet / Easypaisa','Credit (On Account)','Split Payment'];

/* ---------- small helpers ---------- */
function upk(i){return Math.max(1,Math.round(+(i&&i.upp)||1))}
function fq(q,i){
  q=nq(q);const U=upk(i);if(U<=1)return String(q);
  const w=Math.floor(q+0.0005),lo=Math.round((q-w)*U);
  if(lo>=U)return String(w+1);if(!lo)return String(w);
  return (w?w+' pk + ':'')+lo+' loose';
}
function sf(i){return fq(i.stock,i)}
function imatch(i,k){return [i.name,i.barcode,i.salt,i.company,i.category].some(x=>x&&String(x).toLowerCase().includes(k))}
function nowT(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function creditOf(b){
  if(b.pays)return S(b.pays.filter(p=>/^Credit/.test(p.m)),p=>p.a);
  return String(b.payMethod||'').startsWith('Credit')?b.total:0;
}
function pl(mt){mt=String(mt||'');return /^Credit/.test(mt)?'Credit':/^Online/.test(mt)?'Wallet':/^Card/.test(mt)?'Card':/^Cash/.test(mt)?'Cash':'Other'}
function payBreak(b){return b.pays?b.pays.map(p=>({m:p.m,a:p.a})):[{m:b.payMethod||'Cash',a:b.total}]}
function calcTax(lines,sub,disc,pct){
  if(n(pct)>0)return n((sub-disc)*pct/100);
  const f=sub>0?(sub-disc)/sub:1;
  return n(S(lines,l=>l.qty*l.rate*(l.tr||0)/100)*f);
}
function writeOff(from,to){
  return n(S(D.adj.filter(a=>a.qty<0&&(a.reason==='Damage'||a.reason==='Expired')&&a.date>=from&&a.date<=to),a=>{
    const c=a.cost!=null?a.cost:((D.items.find(i=>i.name===a.item)||{}).cost||0);return -a.qty*c}));
}
function restoreStock(i,l,q,skip){
  const d=l.bts;
  if(d&&d.length){
    let r=nq(q),sk=nq(skip||0);
    for(const x of d){
      let a=x.qty;
      if(sk>0){const t=Math.min(a,sk);a=nq(a-t);sk=nq(sk-t)}
      if(a<=0.0005)continue;
      a=Math.min(a,r);if(a>0)addBatch(i,a,x.batch,x.expiry);
      r=nq(r-a);if(r<=0.0005)break;
    }
    if(r>0.0005)addBatch(i,r,'','');
  }else addBatch(i,q,String(l.batch||'').split(', ')[0].replace(/^-$/,''),'');
}
function newBillReset(){cn='';pm='Cash';cph='';rcv='';spC='';spCd='';spW=''}
function retQty(){const it=byNameOrBarcode(val('ret_item')),q=+val('ret_qty')||0;return val('ret_unit')==='l'&&it?q/upk(it):q}
function aud(a,d){
  try{D.audit=D.audit||[];D.audit.push({t:ld()+' '+nowT(),u:currentUser||'-',a:a,d:String(d||'')});
    if(D.audit.length>3000)D.audit.splice(0,D.audit.length-3000)}catch(e){}
}
function printHTML(html,pg){
  $('#printArea').innerHTML=html;
  let st=$('#pgStyle');if(!st){st=document.createElement('style');st.id='pgStyle';document.head.appendChild(st)}
  st.textContent=pg;setTimeout(()=>window.print(),80);
}

/* ---------- simple dialog ---------- */
function dlg(title,fields,okLabel,onok){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0;max-height:92vh;overflow:auto"><b>${esc(title)}</b>${fields.map(f=>`<label>${esc(f.label)}</label>${f.options?`<select id="dg_${f.id}">${f.options.map(x=>`<option ${x==f.value?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="dg_${f.id}" type="${f.type||'text'}" ${f.type==='number'?'step="any"':''} value="${esc(f.value??'')}">`}`).join('')}<div class="row" style="margin-top:6px"><button class="p" id="dg_ok">${esc(okLabel||'OK')}</button><button class="s" id="dg_x">Cancel</button></div></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector('#dg_x').onclick=close;
  o.querySelector('#dg_ok').onclick=()=>{const v={};fields.forEach(f=>v[f.id]=o.querySelector('#dg_'+f.id).value);if(onok(v)!==false)close()};
  const first=o.querySelector('input,select');if(first)first.focus();
}

/* ---------- camera barcode scan ---------- */
async function scanBarcode(cb){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return toast('Camera scanning needs Chrome (Android / desktop) over https. A USB or Bluetooth scanner works everywhere.');
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
  catch(e){return toast('Camera permission was denied.')}
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:500;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px';
  ov.innerHTML='<video playsinline muted autoplay style="max-width:100%;max-height:70vh;border-radius:12px"></video><div style="color:#fff;margin:10px 0">Point the camera at a barcode</div><button class="p" id="scx">Cancel</button>';
  document.body.appendChild(ov);
  const v=ov.querySelector('video');v.srcObject=stream;
  let live=true;
  const stop=()=>{live=false;stream.getTracks().forEach(t=>t.stop());ov.remove()};
  ov.querySelector('#scx').onclick=stop;
  let det;try{det=new BarcodeDetector()}catch(e){stop();return toast('Barcode detection is not available on this device.')}
  try{await v.play()}catch(e){}
  const tick=async()=>{
    if(!live)return;
    try{const r=await det.detect(v);if(r&&r.length){const code=r[0].rawValue;stop();cb(code);return}}catch(e){}
    setTimeout(tick,250);
  };
  tick();
}

/* ---------- write-offs / stock adjustment (pack or loose) ---------- */
window.adjStock=once(function(){
  const i=byNameOrBarcode(val('a_item')),q=+val('a_qty')||0;
  if(!i)return toast('Item not found.');
  if(!q)return toast('Enter a quantity (+ or -).');
  const lo=val('a_unit')==='l',pk=nq(lo?q/upk(i):q);
  if(pk<0&&-pk>i.stock+0.0005)return toast('Only '+sf(i)+' in stock.');
  const reason=val('a_reason');
  if(pk<0)takeStock(i,-pk,reason==='Expired');else addBatch(i,pk,'','');
  D.adj.push({id:nid(),date:today(),item:i.name,qty:pk,lu:lo?q:0,reason:reason,note:val('a_note'),user:currentUser,cost:i.cost});
  aud('Stock adjusted',i.name+' '+(lo?q+' loose':q+' pack')+' | '+reason);
  save();toast('Stock adjusted.');render();
});

/* ---------- audit-log wrappers ---------- */
(function(){
  function wrap(name,pre,post){
    const o=window[name];if(typeof o!=='function')return;
    window[name]=function(){
      let c;try{c=pre&&pre.apply(this,arguments)}catch(e){}
      const r=o.apply(this,arguments);
      try{post&&post.call(this,r,c,arguments)}catch(e){}
      return r;
    };
  }
  wrap('saveBill',null,function(r){
    if(r===true&&last){
      aud('Bill created',(last.type==='sale'?'Sale':'Purchase')+' #'+last.no+' | '+partyName(last.partyId)+' | '+m(last.total)+' | '+last.payMethod);
      if(last.type==='purchase'&&last.partyId>2){
        last.lines.forEach(l=>{const it=D.items.find(x=>x.id==l.itemId);if(it)it.vendor=partyName(last.partyId)});save();
      }
    }
  });
  wrap('ebSave',()=>{const b=eb&&D.bills.find(x=>x.id==eb.id);return b?b.no:null},(r,c)=>{if(c!=null&&!eb)aud('Bill edited','#'+c)});
  wrap('voidBill',id=>D.bills.find(x=>x.id==id),(r,c,a)=>{if(c&&!D.bills.some(x=>x.id==a[0]))aud('Bill cancelled',c.type+' #'+c.no+' | '+m(c.total))});
  wrap('processReturn',()=>D.returns.length,(r,c)=>{if(D.returns.length>c){const x=D.returns[D.returns.length-1];aud('Return',x.type+' bill #'+x.billNo+' | '+x.item+' x '+x.qty+' | refund '+m(x.refund))}});
  wrap('saveItem',()=>({len:D.items.length,cur:cur,snap:cur?JSON.stringify(D.items.find(i=>i.id==cur)):''}),(r,c)=>{
    if(!c)return;
    if(D.items.length>c.len)aud('Item added',D.items[D.items.length-1].name);
    else if(c.cur){const it=D.items.find(i=>i.id==c.cur);if(it&&JSON.stringify(it)!==c.snap)aud('Item updated',it.name)}
  });
  wrap('delItem',id=>D.items.find(i=>i.id==id),(r,c,a)=>{if(c&&!D.items.some(i=>i.id==a[0]))aud('Item deleted',c.name)});
  wrap('addExp',()=>D.exp.length,(r,c)=>{if(D.exp.length>c){const e=D.exp[D.exp.length-1];aud('Expense added',e.cat+' | '+(e.name||'')+' | '+m(e.amt))}});
  wrap('delExp',id=>D.exp.find(e=>e.id==id),(r,c,a)=>{if(c&&!D.exp.some(e=>e.id==a[0]))aud('Expense deleted',c.cat+' | '+m(c.amt))});
  wrap('addParty',()=>D.parties.length,(r,c)=>{if(D.parties.length>c)aud('Party added',D.parties[D.parties.length-1].name)});
  wrap('delParty',id=>D.parties.find(p=>p.id==id),(r,c,a)=>{if(c&&!D.parties.some(p=>p.id==a[0]))aud('Party deleted',c.name)});
  wrap('delUser',k=>D.users[k],(r,c,a)=>{if(c&&!D.users.includes(c))aud('User deleted',c.user)});
  wrap('logout',()=>{aud('Logout','')},null);
  wrap('restore',()=>D,(r,c)=>{if(c!==D){aud('Backup restored','');save()}});
  wrap('backup',null,()=>aud('Backup downloaded',''));
})();

/* ---------- parties: edit + credit limit ---------- */
function editParty(id){
  const p=D.parties.find(x=>x.id==id);if(!p||p.id<=2)return;
  dlg('Edit '+p.name,[{id:'name',label:'Name',value:p.name},{id:'phone',label:'Phone',value:p.phone||''},{id:'limit',label:'Credit limit (Rs, empty = no limit)',type:'number',value:p.limit||''}],'Save',v=>{
    const nm=v.name.trim();if(!nm){toast('Enter a name.');return false}
    if(D.parties.some(x=>x.id!=id&&x.type===p.type&&x.name.toLowerCase()===nm.toLowerCase())){toast('This name already exists.');return false}
    p.name=nm;p.phone=v.phone.trim();p.limit=Math.max(0,n(v.limit));aud('Party edited',nm);save();render();
  });
}
const _acr=applyCustRates;
applyCustRates=function(){
  _acr();
  const nm=cn.trim().toLowerCase(),p=nm&&D.parties.find(x=>x.type==='customer'&&x.id>2&&x.name.toLowerCase()===nm);
  if(p&&p.phone&&!cph){cph=p.phone;const e=$('#b_cphone');if(e)e.value=cph}
};
const _bf=billFor;
billFor=function(id){_bf(id);const p=D.parties.find(x=>x.id==id);if(p){cph=p.phone||'';render()}};

/* ---------- payments: receive / pay, receipts, edit, delete ---------- */
function payParty(id){
  const p=D.parties.find(x=>x.id==id);if(!p)return;
  const cust=p.type==='customer';
  dlg((cust?'Receive payment from ':'Pay supplier ')+p.name,[
    {id:'amt',label:'Amount',type:'number'},
    {id:'m',label:'Method',options:['Cash','Card','Online Wallet / Easypaisa','Bank Transfer']},
    {id:'note',label:'Note (optional)'}],cust?'Receive':'Pay',v=>{
    const a=n(v.amt);if(a<=0){toast('Enter an amount.');return false}
    if(a>balance(p)+0.005&&!confirm('This is more than the balance due ('+m(balance(p))+'). Record it anyway?'))return false;
    const pay={id:nid(),partyId:id,amt:a,date:today(),time:nowT(),m:v.m,note:v.note.trim(),man:true,user:currentUser};
    D.pay.push(pay);aud(cust?'Payment received':'Payment made',p.name+' | '+m(a)+' | '+v.m);
    save();toast('Payment recorded.');render();
    if(confirm('Print a receipt for this payment?'))printReceipt(pay.id);
  });
}
function receiptHtml(p){

/* ---------- cash closing ---------- */
const pm0=x=>x.m||(/^Return/.test(x.note||'')?'Adjust':'Cash');
function cashBook(td){
  const ptype=id=>(D.parties.find(p=>p.id==id)||{}).type;
  const sales=D.bills.filter(b=>b.date==td&&b.type==='sale'),purch=D.bills.filter(b=>b.date==td&&b.type==='purchase'),by={Cash:0,Card:0,Wallet:0,Credit:0};
  sales.forEach(b=>payBreak(b).forEach(p=>{const k=pl(p.m);by[k]=(by[k]||0)+p.a}));
  const cp=D.pay.filter(x=>x.date==td&&pm0(x)==='Cash');
  const recv=S(cp.filter(x=>ptype(x.partyId)==='customer'),x=>x.amt),paidV=S(cp.filter(x=>ptype(x.partyId)==='vendor'),x=>x.amt);
  const cashPart=b=>S(payBreak(b).filter(p=>pl(p.m)==='Cash'),p=>p.a);
  const purCash=S(purch,cashPart);
  const exp=S(D.exp.filter(e=>e.date==td),e=>e.amt);
  const rets=D.returns.filter(r=>r.date==td);
  const refunds=S(rets.filter(r=>(r.type||'sale')==='sale'),r=>{const b=D.bills.find(x=>x.type==='sale'&&x.no==r.billNo);return b&&b.total?n(r.refund*cashPart(b)/b.total):0});
  const prefund=S(rets.filter(r=>r.type==='purchase'),r=>{const b=D.bills.find(x=>x.type==='purchase'&&x.no==r.billNo);return b&&b.total?n(r.refund*cashPart(b)/b.total):0});
  const prev=[...D.closings].filter(x=>x.date<td).sort((a,b)=>a.date<b.date?1:-1)[0];
  const open=D.cash[td]&&D.cash[td].open!=null?n(D.cash[td].open):(prev?prev.counted:0);
  const inn=n(by.Cash+recv+prefund),out=n(purCash+paidV+exp+refunds);
  return {by,recv,prefund,purCash,paidV,exp,refunds,open,inn,out,expected:n(open+inn-out)};
}
function setOpen(v){const td=today();D.cash[td]=D.cash[td]||{};D.cash[td].open=n(v);save();render()}
function ccDiff(){
  const e=$('#cc_cnt'),o=$('#cc_diff');if(!e||!o)return;
  if(e.value===''){o.textContent='';return}
  const d=n(n(e.value)-(+e.dataset.exp));
  o.innerHTML=d===0?'<span class="pos">Matches exactly</span>':d>0?'<span class="pos">Over by '+m(d)+'</span>':'<span class="neg">Short by '+m(-d)+'</span>';
}
function closeDay(){
  const e=$('#cc_cnt');if(!e||e.value==='')return toast('Enter the cash you counted in the drawer first.');
  const td=today(),c=cashBook(td),cnt=n(e.value);
  D.closings=D.closings.filter(x=>x.date!==td);
  D.closings.push({id:nid(),date:td,time:nowT(),open:c.open,expected:c.expected,counted:cnt,diff:n(cnt-c.expected),card:c.by.Card||0,wallet:c.by.Wallet||0,credit:c.by.Credit||0,user:currentUser});
  aud('Day closed','expected '+m(c.expected)+' | counted '+m(cnt));
  save();toast('Day closed. Tomorrow\'s opening cash will be '+m(cnt)+'.');render();
}
function closingCard(){
  const td=today(),c=cashBook(td),done=D.closings.find(x=>x.date===td);
  const row=(a,v,cls)=>`<tr><td>${a}</td><td class="r ${cls||''}">${m(v)}</td></tr>`;
  const hist=[...D.closings].sort((a,b)=>a.date<b.date?1:-1).slice(0,7);
  return `<div class="card"><b>Today's Cash Closing</b>
  <label>Opening cash in drawer</label><input type="number" step="any" value="${c.open||''}" placeholder="0" onchange="setOpen(this.value)">
  <div class="scroll"><table>
  ${row('+ Cash sales',c.by.Cash)}${row('+ Cash received from customers',c.recv)}${c.prefund?row('+ Cash refunds from suppliers',c.prefund):''}
  ${row('- Cash purchases',-c.purCash,'neg')}${row('- Payments to suppliers (cash)',-c.paidV,'neg')}${row('- Expenses',-c.exp,'neg')}${row('- Cash refunds to customers',-c.refunds,'neg')}
  <tr><td><b>Expected cash in drawer</b></td><td class="r"><b>${m(c.expected)}</b></td></tr></table></div>
  <label>Cash actually counted</label><input id="cc_cnt" type="number" step="any" data-exp="${c.expected}" value="${done?done.counted:''}" oninput="ccDiff()"><div id="cc_diff" style="margin-top:4px"></div>

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function build(){
    if($('licOverlay'))return;
    var d=document.createElement('div');d.id='licOverlay';
    d.style.cssText='display:none;position:fixed;inset:0;z-index:500;background:linear-gradient(135deg,#073b4c,#0e7c86);align-items:center;justify-content:center;padding:16px;overflow:auto';
    d.innerHTML='<div class="poster-card" style="max-width:440px"><h1>Activate License</h1><div class="sub">Powered by ADI BUTT</div>'
      +'<div style="text-align:left"><label>Your Device ID</label>'
      +'<div style="display:flex;gap:8px"><input id="licId" readonly style="font:600 16px/1.2 monospace;letter-spacing:1px;text-align:center"><button class="s sm" style="margin:0" onclick="licCopyId()">Copy</button></div>'
      +'<div style="font-size:12px;color:var(--mu);margin-top:4px">Send this ID to ADI BUTT to get your license key.</div>'
      +(CONTACT_WA?'<button class="s" style="width:100%" onclick="licWA()">Send ID on WhatsApp</button>':'')
      +'<label style="margin-top:14px">License Key</label><textarea id="licKey" rows="4" placeholder="Paste your license key here" style="font:12px monospace" autocomplete="off" spellcheck="false"></textarea></div>'
      +'<button class="p" id="licBtn" style="width:100%;margin-top:12px" onclick="licActivate()">Activate</button>'
      +'<div id="licMsg" style="margin-top:10px;font-size:13px;min-height:18px;color:var(--bad)"></div>'
      +'<a href="#" id="licCancel" style="display:none;color:var(--mu);font-size:13px" onclick="licHide();return false">Cancel</a></div>';
    document.body.appendChild(d);
  }
  function show(optional,msg){
    build();$('licId').value=fmtId(devId());
    $('licMsg').style.color='var(--bad)';$('licMsg').textContent=msg||'';
    $('licCancel').style.display=optional?'inline':'none';
    $('licOverlay').style.display='flex';
  }
  function hide(){var o=$('licOverlay');if(o)o.style.display='none'}
  window.licCopyId=function(){
    var t=fmtId(devId());
    try{navigator.clipboard.writeText(t).then(function(){$('licMsg').style.color='var(--ok)';$('licMsg').textContent='Device ID copied.'})}
    catch(e){$('licId').select();try{document.execCommand('copy')}catch(x){}}
  };
  window.licWA=function(){window.open('https://wa.me/'+CONTACT_WA+'?text='+encodeURIComponent('License request. Device ID: '+fmtId(devId())),'_blank')};
  window.licHide=hide;
  window.licActivate=async function(){
    var k=$('licKey').value.trim(),b=$('licBtn');
    if(!k){$('licMsg').style.color='var(--bad)';$('licMsg').textContent='Paste the license key first.';return}
    b.disabled=true;
    try{
      var r=await verify(k);
      if(!r.ok){$('licMsg').style.color='var(--bad)';$('licMsg').textContent=r.msg;return}
      ls(LS_LIC,k.replace(/\s+/g,''));
      st={ok:true,pending:false,exp:r.exp,days:r.days,msg:''};
      hide();$('licKey').value='';
      var t=document.getElementById('toast');if(t){t.textContent='License activated.'+(r.exp?' Valid until '+r.exp+'.':'');t.style.display='block';setTimeout(function(){t.style.display='none'},2600)}
      if(window.render&&window.currentUser)try{render()}catch(e){}
    }finally{b.disabled=false}
  };
  /* used by the app */
  window.licState=function(){return st};
  window.licShow=show;
  window.licGuard=async function(){ /* true when the app may be used; shows the screen otherwise */
    if(st.pending&&pend)await pend;
    if(st.ok&&st.exp&&daysLeft(st.exp)<0){await check()}
    if(st.ok)return true;
    show(false,st.msg);return false;
  };
  window.licInfo=function(){return {id:fmtId(devId()),ok:st.ok,exp:st.exp,days:st.days}};
  window.licCard=function(){
    var i=licInfo(),s=i.ok?(i.exp?'Active - expires '+esc(i.exp)+' ('+i.days+' days left)':'Active - lifetime license'):'Not active';
    return '<div class="card"><b>License</b><div class="'+(i.ok?'pos':'neg')+'" style="margin:6px 0;font-weight:600">'+s+'</div>'
      +'<div class="empty">Device ID: <b style="font-family:monospace;color:var(--tx)">'+esc(i.id)+'</b></div>'
      +'<button class="s" onclick="licShow(true)">Enter / change license key</button></div>';
  };
  window.licWarn=function(){
    var i=licInfo();
    if(i.ok&&i.exp&&i.days<=7){var t=document.getElementById('toast');if(t){t.textContent='License expires in '+i.days+' day'+(i.days===1?'':'s')+' ('+i.exp+'). Contact ADI BUTT to renew.';t.style.display='block';setTimeout(function(){t.style.display='none'},5000)}}
  };
  /* start: verify the saved key, then re-check every minute */
  devId();
  pend=check().then(function(r){if(!r.ok&&document.body)show(false,r.msg);return r});
  setInterval(function(){check().then(function(r){if(!r.ok)show(false,r.msg)})},60000);
})();
</script>
</body>
</html>
